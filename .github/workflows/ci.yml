name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Run Ruff (Lint & Format)
        run: uv run ruff check .

      - name: Run Pytest
        env:
          OPENAI_API_KEY: "mock-key-for-unit-tests"
        run: uv run pytest tests/unit